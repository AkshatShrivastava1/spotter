name: Nudges

# Wakes the API and runs one pass of the nudge engine every 30 minutes.
# Not every 15: each wake keeps the free server up for 15 min, and Render's free tier has
# 750 instance hours a month shared across all services. Every nudge window is 1.5 h or longer.
# Needs repo secrets SPOTTER_API_URL and SPOTTER_CRON_SECRET; does nothing until they're set.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger nudges
        env:
          API_URL: ${{ secrets.SPOTTER_API_URL }}
          SECRET: ${{ secrets.SPOTTER_CRON_SECRET }}
        run: |
          if [ -z "$API_URL" ] || [ -z "$SECRET" ]; then
            echo "Secrets not set yet; skipping."
            exit 0
          fi
          curl -fsS --retry 3 --retry-delay 20 --max-time 90 -X POST "$API_URL/internal/run-nudges" -H "X-Cron-Secret: $SECRET"
